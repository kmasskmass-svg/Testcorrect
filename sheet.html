<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورقة الإجابة OMR</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* ورقة A4 جاهزة للطباعة.
       مهم: كل ما هو داخل الإطار الأسود يجب أن يكون الفقاعات وأرقام الأسئلة فقط،
       أما الاسم والعنوان فخارج الإطار حتى لا يُلتبس خط اليد بالفقاعات. */
    @page { size: A4; margin: 12mm; }
    * { box-sizing: border-box; }
    body { font-family: "Tajawal", sans-serif; margin: 0; background: #e9edf3; color: #111; }
    .page {
      width: 210mm; min-height: 297mm; margin: 10mm auto; padding: 14mm 20mm;
      background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 2mm; font-size: 20pt; text-align: center; }
    .course { text-align: center; margin: 0 0 6mm; font-size: 13pt; }
    .fields { display: grid; grid-template-columns: 2fr 1fr; gap: 6mm; margin-bottom: 8mm; font-size: 12pt; }
    .fields div { border-bottom: 1px dashed #555; padding-bottom: 2mm; }
    .note { font-size: 10pt; color: #444; margin: 0 0 6mm; }

    /* الإطار الأسود السميك = «أكبر مستطيل» الذي يبحث عنه التطبيق */
    .frame {
      border: 3mm solid #000; width: 170mm; margin: 0 auto;
      padding: 10mm 16mm 8mm;
    }
    .head, .row { display: flex; align-items: center; justify-content: center; gap: 8mm; }
    .head { margin-bottom: 4mm; font-size: 10pt; font-weight: 700; }
    .head span { width: 8mm; text-align: center; }
    .head .num, .row .num { width: 10mm; }
    .row { height: 15mm; }
    .num { font-size: 10pt; font-weight: 700; text-align: center; }
    .bubble {
      width: 8mm; height: 8mm; border-radius: 50%;
      border: 0.6mm solid #000; background: #fff;
    }
    .print-btn {
      display: block; margin: 0 auto; padding: 10px 24px; font: inherit; font-weight: 700;
      border: 0; border-radius: 10px; background: #1f6feb; color: #fff; cursor: pointer;
    }
    @media print {
      body { background: #fff; }
      .page { margin: 0; box-shadow: none; padding: 0; min-height: auto; }
      .print-btn { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>ورقة إجابة — اختبار قصير</h1>
    <p class="course">المقرر: ............................................</p>
    <div class="fields">
      <div>اسم المتدرب:</div>
      <div>الرقم التدريبي:</div>
    </div>
    <p class="note">ظلّل الدائرة بالكامل بقلم أسود أو أزرق داكن. لا تكتب أي شيء داخل الإطار الأسود.</p>

    <div class="frame">
      <div class="head" id="head"></div>
      <div id="rows"></div>
    </div>
  </div>
  <br />
  <button class="print-btn" onclick="window.print()">🖨️ طباعة</button>
  <br />

  <script>
    // يجب أن تطابق هذه القيم CONFIG في app.js
    const NUM_QUESTIONS = 10;
    const LABELS = ['أ', 'ب', 'ج', 'د'];

    // في الاتجاه RTL يظهر العنصر الأول في أقصى اليمين: رقم السؤال ثم أ ب ج د
    document.getElementById('head').innerHTML =
      '<span class="num"></span>' + LABELS.map(l => `<span>${l}</span>`).join('');
    document.getElementById('rows').innerHTML = Array.from({ length: NUM_QUESTIONS }, (_, i) =>
      `<div class="row"><span class="num">${i + 1}</span>${LABELS.map(() => '<span class="bubble"></span>').join('')}</div>`
    ).join('');
  </script>
</body>
</html>
